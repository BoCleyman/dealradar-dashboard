<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>DealRadar</title>
<style>
:root { --bg: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink2: #52514e; --axis: #c3c2b7; --hair: rgba(11,11,11,.10);
  --accent: #2a78d6; --on-accent: #ffffff; --err: #d03b3b; --font: system-ui, -apple-system, "Segoe UI", sans-serif; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0d0d0d; --surface: #1a1a19; --ink: #f0efec;
  --ink2: #c3c2b7; --axis: #383835; --hair: rgba(255,255,255,.10); --accent: #3987e5; --on-accent: #0b0b0b; --err: #ec835a; color-scheme: dark; } }
:root[data-theme="dark"] { --bg: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink2: #c3c2b7; --axis: #383835;
  --hair: rgba(255,255,255,.10); --accent: #3987e5; --on-accent: #0b0b0b; --err: #ec835a; color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--ink);
  font: 14px/1.45 var(--font); }
form { width: min(100%, 340px); background: var(--surface); border: 1px solid var(--hair); border-radius: 8px; padding: 20px;
  display: flex; flex-direction: column; gap: 12px; }
h1 { margin: 0; font-size: 20px; font-weight: 650; }
p { margin: 0; color: var(--ink2); }
input, button { font: inherit; min-height: 38px; border-radius: 6px; }
input { border: 1px solid var(--axis); background: var(--surface); color: var(--ink); padding: 6px 10px; }
button { border: 0; background: var(--accent); color: var(--on-accent); font-weight: 600; cursor: pointer; }
button:disabled { opacity: .6; cursor: progress; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#err { color: var(--err); min-height: 1.4em; }
</style>
</head>

  <button id="go" type="submit">Openen</button>
  <div id="err" role="alert"></div>
</form>

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock(pw) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(P.s), iterations: P.n, hash: "SHA-256" }, base,
    { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  return new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(P.i) }, key, b64(P.c)));
}
document.getElementById("f").addEventListener("submit", async e => {
  e.preventDefault();
  const go = document.getElementById("go"), err = document.getElementById("err");
  go.disabled = true; go.textContent = "Bezig met ontgrendelen…"; err.textContent = "";
  try {
    const html = await unlock(document.getElementById("pw").value);
    document.open(); document.write(html); document.close();
  } catch (x) {
    go.disabled = false; go.textContent = "Openen";
    err.textContent = window.crypto && crypto.subtle ? "Onjuist wachtwoord." : "Deze pagina moet via https geopend worden.";

});
